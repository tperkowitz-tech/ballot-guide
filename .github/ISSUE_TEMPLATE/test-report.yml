name: Tested it on my ballot
description: Tell others where the guide worked. Coarse location only.
title: "Test report"
labels: [tested]
body:
  - type: markdown
    attributes:
      value: "Help others know where this works. Do not include your address, political views, how you voted, or anything that identifies you."
  - type: dropdown
    id: state
    attributes:
      label: State
      options:
        - "Alabama"
        - "Alaska"
        - "Arizona"
        - "Arkansas"
        - "California"
        - "Colorado"
        - "Connecticut"
        - "Delaware"
        - "District of Columbia"
        - "Florida"
        - "Georgia"
        - "Hawaii"
        - "Idaho"
        - "Illinois"
        - "Indiana"
        - "Iowa"
        - "Kansas"
        - "Kentucky"
        - "Louisiana"
        - "Maine"
        - "Maryland"
        - "Massachusetts"
        - "Michigan"
        - "Minnesota"
        - "Mississippi"
        - "Missouri"
        - "Montana"
        - "Nebraska"
        - "Nevada"
        - "New Hampshire"
        - "New Jersey"
        - "New Mexico"
        - "New York"
        - "North Carolina"
        - "North Dakota"
        - "Ohio"
        - "Oklahoma"
        - "Oregon"
        - "Pennsylvania"
        - "Rhode Island"
        - "South Carolina"
        - "South Dakota"
        - "Tennessee"
        - "Texas"
        - "Utah"
        - "Vermont"
        - "Virginia"
        - "Washington"
        - "West Virginia"
        - "Wisconsin"
        - "Wyoming"
        - "Other/territory"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: County or city
      description: optional; leave blank if you prefer
  - type: dropdown
    id: election
    attributes:
      label: Election
      options: [Primary, General, Special, Other]
    validations:
      required: true
  - type: input
    id: election_date
    attributes:
      label: Election date
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: dropdown
    id: used_in
    attributes:
      label: Where did you use it?
      options: [Web kit, Claude apps, Claude Code, Codex, Other agent tool, Plain prompts in another AI chat]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: AI model or service (optional)
      placeholder: e.g. Gemini 2.5
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Neutral comparison, Values match, Both]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps that worked
      description: "For example: found the ballot, researched races, fact-checked measures, double-check, scores, built the guide."
  - type: dropdown
    id: overall
    attributes:
      label: Overall
      options: [Worked well, Worked with fixes, Did not work]
    validations:
      required: true
  - type: textarea
    id: problems
    attributes:
      label: Problems or tips (optional)
      description: Please remove addresses and personal details from anything you paste.
  - type: input
    id: version
    attributes:
      label: Version (optional)
      description: Filled in automatically when you come from the web kit.
